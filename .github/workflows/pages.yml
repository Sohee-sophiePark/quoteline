name: pages
on:
  push:
    branches: [main]
  schedule:
    - cron: "30 6 * * 1-5"  # daily feed after arXiv's midnight-ET update
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RUN_MODE: replay
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web
      - uses: astral-sh/setup-uv@v10.2.0  # no floating major tags since v8
        with:
          python-version: "3.11"
      - run: uv sync --frozen
      - run: uv run quoteline feed  # public sources only: no LLM, no secrets
        continue-on-error: true  # the site still deploys; the feed tab says it is unavailable
      - run: uv run quoteline export
      - run: VITE_STATIC=1 npm run build --prefix web
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
