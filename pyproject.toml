[project]
name = "quoteline"
version = "0.1.0"
description = "Citation-verified AI/ML research agent with a contextual-bandit source policy and a daily paper feed."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.142.2",
  "uvicorn==0.54.0",
  "pydantic==2.13.5",
  "numpy==2.4.6",
  "pyyaml==6.0.3",
  "google-genai==2.28.0",
  "httpx==0.28.1",
]

[project.scripts]
quoteline = "quoteline.cli:main"

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "ruff==0.16.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quoteline"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["web", "runs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.ruff.lint.isort]
known-first-party = ["quoteline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
